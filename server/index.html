<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Live Stream</title>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>DASH Live Stream Demo</h1>
      <h2>
        This is a demo of live streaming that uses the DASH protocol along with
        OBS to record and ffmpeg to encode the stream to DASH protocol.
      </h2>
      <video id="videoPlayer" controls muted></video>
    </div>
    <script>
      var url = "/dash/stream/output.mpd";
      var player = dashjs.MediaPlayer().create();
      player.initialize(document.getElementById("videoPlayer"), url, true);
    </script>
    <style>
      body {
        min-width: 100vw;
        min-height: 100vh;
        background-color: aqua;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      h1 {
        color: aliceblue;
        font-size: 32pt;
      }
      h2 {
        color: aliceblue;
        font-size: 12pt;
        width: 50%;
        padding-bottom: 20px;
        text-align: center;
        border-radius: 10px;
        background-color: rgba(0, 0, 0, 0.521);
        padding: 20px;
      }

      .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding-left: 20px;
        padding-right: 20px;
        background: radial-gradient(circle at center, #00c6ff 0%, #0072ff 100%);
        flex: 1;
        width: 100%;
        height: 100%;
      }
      #videoPlayer {
        width: 60%;
        /* height: 100%; */
        background: radial-gradient(circle at center, #8400ff 0%, #4d0e64 100%);
      }
    </style>
  </body>
</html>
